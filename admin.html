<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KMath · Quản trị — Duyệt tài khoản</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Exo+2:wght@700;800;900&display=swap">
<link rel="stylesheet" href="style.css">
<style>
/* Các lớp dùng riêng cho trang Quản trị — tái dùng đúng biến/token của style.css chính, không bịa màu mới */
.kmEmailChip{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px;font-family:var(--f-code,"JetBrains Mono",monospace);
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.12);padding:7px 12px;border-radius:999px;color:#CBD5E1}
.kmStatGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:18px 0 16px}
.kmSoLon{font-size:25px;font-weight:800;color:var(--chu,#E2E8F0);line-height:1}
.mdChip-cho{background:rgba(250,204,21,.12);color:#FDE68A;border:1px solid rgba(250,204,21,.35)}
.mdChip-duyet{background:rgba(16,185,129,.15);color:#6EE7B7;border:1px solid rgba(110,231,183,.35)}
.mdChip-het{background:rgba(239,68,68,.15);color:#FCA5A5;border:1px solid rgba(252,165,165,.4)}
.kmRow{display:flex;align-items:center;gap:16px;padding:14px 6px;border-top:1px solid rgba(148,163,184,.14)}
.kmRow:first-child{border-top:0}
.kmRow:hover{background:rgba(94,235,255,.035);border-radius:10px}
.kmAvt{width:42px;height:42px;border-radius:50%;background:rgba(94,235,255,.10);border:1px solid rgba(94,235,255,.3);color:#5EEBFF;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13.5px;flex:none}
@media (max-width:860px){
  .kmStatGrid{grid-template-columns:1fr!important}
  .kmRow{flex-wrap:wrap!important}
  .kmRow .tacVu{width:100%!important;justify-content:flex-start!important}
  .hangBoLuat{flex-direction:column!important;align-items:stretch!important}
  .locDs{flex-wrap:wrap!important}
}
</style>
</head>
<body>
<div class="kmNen" aria-hidden="true"><div class="kmNen__anh"></div><div class="kmNen__mo"></div><div class="kmNen__phu"></div><canvas id="kmNenSao"></canvas></div>

<header class="dau">
	<div class="khung">
		<div class="kmLogoDau"><img src="logo-neon.png" alt="Logo KMath"><div class="kmLogoChu"><h1 class="ten">KMath</h1><p class="mota">Quản trị · Duyệt tài khoản</p></div></div>
		<div class="taiKhoan">
			<span id="emailNd" class="kmEmailChip"></span>
			<a class="nut" href="index.html">Về công cụ</a>
		</div>
	</div>
	<div class="vach"></div>
</header>

<main class="khung">
	<section class="manHinh" id="manKhong" hidden>
		<h2>Không có quyền</h2>
		<p>Trang này chỉ dành cho quản trị viên. Hãy đăng nhập bằng Gmail quản trị ở trang công cụ.</p>
		<a class="nut" href="index.html">Về trang đăng nhập</a>
	</section>

	<section id="manQT" hidden>

		<div class="kmStatGrid">
			<div class="mdThe" style="display:flex;align-items:center;gap:14px">
				<div class="mdDauIco"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg></div>
				<div><div class="kmSoLon" id="demCho">0</div><div class="mdNhan" style="margin-top:5px">Chờ duyệt</div></div>
			</div>
			<div class="mdThe" style="display:flex;align-items:center;gap:14px">
				<div class="mdDauIco"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 13 4 4L19 7"/></svg></div>
				<div><div class="kmSoLon" id="demDuyet">0</div><div class="mdNhan" style="margin-top:5px">Đang dùng</div></div>
			</div>
			<div class="mdThe" style="display:flex;align-items:center;gap:14px">
				<div class="mdDauIco"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></div>
				<div><div class="kmSoLon" id="demHet">0</div><div class="mdNhan" style="margin-top:5px">Hết hạn / bị khoá</div></div>
			</div>
		</div>

		<div class="mdThe">
			<div class="mdDau">
				<div class="mdDauTen">
					<div class="mdDauIco"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/><path d="M9 13h6M9 17h4"/></svg></div>
					<div>
						<h2>Bộ luật chuẩn hoá</h2>
						<p class="kmMono" id="ttBoLuat">đang kiểm tra…</p>
					</div>
				</div>
			</div>
			<div class="hangBoLuat" style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
				<label class="nut" for="fileBoLuat" style="margin:0">
					<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" aria-hidden="true"><path d="M12 16V4m0 0 4 4m-4-4-4 4"/><path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
					Chọn file engine.js mới
					<input type="file" id="fileBoLuat" accept=".js,text/javascript" style="display:none">
				</label>
				<input class="mdO" type="text" id="phienBan" placeholder="Tên phiên bản — VD: 1.1 (22/10/2026)" style="flex:1 1 240px;min-width:200px">
				<button class="nut chinh" id="nutTaiBoLuat" type="button">Cập nhật bộ luật</button>
			</div>
		</div>

		<div class="mdThe locDs nhLocBar" style="margin-top:16px">
			<div style="position:relative;flex:1 1 240px;min-width:200px">
				<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#7d87a0" stroke-width="2" stroke-linecap="round" style="position:absolute;left:12px;top:50%;transform:translateY(-50%)" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
				<input type="text" id="timEmail" class="mdO" placeholder="Tìm theo email hoặc tên…" aria-label="Tìm người dùng" style="width:100%;box-sizing:border-box;padding-left:34px">
			</div>
			<select id="locTT" class="mdO" aria-label="Lọc trạng thái">
				<option value="tatca">Tất cả</option>
				<option value="cho" selected>Chờ duyệt</option>
				<option value="duyet">Đang dùng</option>
				<option value="het">Hết hạn / bị khoá</option>
			</select>
			<button class="nut" id="nutTai" type="button">Tải lại</button>
		</div>

		<div class="mdThe" style="margin-top:16px;padding:10px 14px 16px">
			<div id="bang"><div class="mdTrong">Đang tải…</div></div>
		</div>
	</section>
</main>
<div class="toast" id="toast" role="status"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, getDocs, doc, getDoc, setDoc, updateDoc, Timestamp, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { firebaseConfig, EMAIL_QUAN_TRI } from "./cauhinh.js";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app), db = getFirestore(app);
const $ = id => document.getElementById(id);
let ds = [];
function hien(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("hien"); clearTimeout(hien.t); hien.t = setTimeout(() => t.classList.remove("hien"), 2000); }
function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]); }
const ngay = t => t ? t.toDate().toLocaleDateString("vi-VN") : "—";

onAuthStateChanged(auth, user => {
	if (!user || !EMAIL_QUAN_TRI.includes(user.email)) { $("manKhong").hidden = false; return; }
	$("emailNd").textContent = user.email;
	$("manQT").hidden = false;
	tai();
	ttBoLuat();
});

/* ---------- bộ luật ---------- */
async function ttBoLuat() {
	try {
		const s = await getDoc(doc(db, "heThong", "boLuat"));
		$("ttBoLuat").textContent = s.exists()
			? "phiên bản " + (s.data().phienBan || "?") + " · cập nhật " + ngay(s.data().capNhat) + " · " + Math.round(s.data().ma.length / 1024) + " KB"
			: "CHƯA CÓ — hãy tải file engine.js lên để người dùng sử dụng được";
	} catch (e) { $("ttBoLuat").textContent = "không đọc được (" + e.code + ")"; }
}
$("nutTaiBoLuat").addEventListener("click", async () => {
	const f = $("fileBoLuat").files[0];
	if (!f) { hien("Chưa chọn file engine.js"); return; }
	const ma = await f.text();
	// chạy thử trước khi tải lên
	try {
		const hop = {}; new Function("window", ma)(hop);
		const r = hop.TDK.chuanHoa("$\\frac12 \\leq x$, $90^0$");
		if (!/\\dfrac\{1\}\{2\}/.test(r.ketQua)) throw new Error("kết quả chạy thử sai");
	} catch (e) { hien("File không hợp lệ: " + e.message); return; }
	if (ma.length > 900000) { hien("File quá lớn (giới hạn khoảng 900 KB)"); return; }
	$("nutTaiBoLuat").disabled = true;
	try {
		await setDoc(doc(db, "heThong", "boLuat"), { ma, phienBan: $("phienBan").value.trim() || new Date().toLocaleDateString("vi-VN"), capNhat: serverTimestamp() });
		hien("Đã cập nhật bộ luật"); $("fileBoLuat").value = ""; ttBoLuat();
	} catch (e) { hien("Không lưu được: " + e.code); }
	$("nutTaiBoLuat").disabled = false;
});

function trangThai(d) {
	if (!d.daDuyet) return d.ngayDuyet ? "het" : "cho";
	if (d.hetHan && d.hetHan.toDate() < new Date()) return "het";
	return "duyet";
}
const NHAN = { cho: ["Chờ duyệt", "mdChip-cho"], duyet: ["Đang dùng", "mdChip-duyet"], het: ["Hết hạn / khoá", "mdChip-het"] };

async function tai() {
	const snap = await getDocs(collection(db, "nguoiDung"));
	ds = snap.docs.map(s => ({ id: s.id, ...s.data() }))
		.sort((a, b) => (b.ngayDangKy?.toMillis?.() || 0) - (a.ngayDangKy?.toMillis?.() || 0));
	ve();
}
function khoiTao(ten) {
	const p = String(ten ?? "").trim().split(/\s+/);
	return ((p.at(-2)?.[0] || "") + (p.at(-1)?.[0] || "")).toUpperCase() || "?";
}
function ve() {
	const tim = $("timEmail").value.trim().toLowerCase(), loc = $("locTT").value;
	const dem = { cho: 0, duyet: 0, het: 0 };
	ds.forEach(d => dem[trangThai(d)]++);
	$("demCho").textContent = dem.cho;
	$("demDuyet").textContent = dem.duyet;
	$("demHet").textContent = dem.het;
	const hang = ds.filter(d => (loc === "tatca" || trangThai(d) === loc) &&
		(!tim || (d.email || "").toLowerCase().includes(tim) || (d.ten || "").toLowerCase().includes(tim)));
	$("bang").innerHTML = hang.length ? hang.map(d => {
		const tt = trangThai(d), [nhan, lop] = NHAN[tt];
		return '<div class="kmRow" data-id="' + d.id + '">' +
			'<div class="kmAvt">' + khoiTao(d.ten) + '</div>' +
			'<div style="flex:1 1 220px;min-width:180px">' +
				'<div style="font-size:14px;font-weight:700;color:#eef2f8">' + esc(d.ten) + '</div>' +
				'<div class="kmMono" style="font-size:12.5px;color:var(--phu,#94A3B8);margin-top:2px">' + esc(d.email) + '</div>' +
			'</div>' +
			'<div style="width:96px;flex:none;font-size:12.5px;color:var(--phu,#94A3B8)">' +
				'<div style="color:#7d87a0">Đăng ký</div><div class="kmMono" style="margin-top:2px">' + ngay(d.ngayDangKy) + '</div>' +
			'</div>' +
			'<div style="width:140px;flex:none"><span class="mdChip ' + lop + '">' + nhan + '</span></div>' +
			'<div style="width:120px;flex:none;font-size:12.5px;color:var(--phu,#94A3B8)">' +
				'<div style="color:#7d87a0">Hạn dùng</div><div class="kmMono" style="margin-top:2px;color:var(--chu,#cdd4e3)">' + (d.daDuyet ? (d.hetHan ? ngay(d.hetHan) : "Không giới hạn") : "—") + '</div>' +
			'</div>' +
			'<div style="width:64px;flex:none;text-align:center">' +
				'<div class="kmMono" style="font-size:15px;font-weight:700;color:#eef2f8">' + (d.luotDung || 0) + '</div><div style="font-size:11px;color:#7d87a0">lượt</div>' +
			'</div>' +
			'<input type="text" class="mdO ghiChu" value="' + esc(d.ghiChu) + '" placeholder="Ghi chú…" aria-label="Ghi chú" style="width:140px;flex:none">' +
			'<div class="tacVu" style="display:flex;gap:8px;flex:none;margin-left:auto">' +
				'<select class="mdO thoiHan" aria-label="Thời hạn">' +
				'<option value="1">1 tháng</option><option value="3">3 tháng</option><option value="6">6 tháng</option>' +
				'<option value="12" selected>12 tháng</option><option value="0">Không giới hạn</option></select>' +
				'<button class="nut chinh" data-tv="duyet" type="button">' + (tt === "cho" ? "Duyệt" : "Gia hạn") + '</button>' +
				(d.daDuyet ? '<button class="nut" data-tv="khoa" type="button">Khoá</button>' : "") +
			'</div>' +
		'</div>';
	}).join("") : '<div class="mdTrong">Không có người dùng nào phù hợp.</div>';
}
$("bang").addEventListener("click", async e => {
	const b = e.target.closest("button[data-tv]"); if (!b) return;
	const row = b.closest("[data-id]"), id = row.dataset.id, d = ds.find(x => x.id === id);
	const ghiChu = row.querySelector(".ghiChu").value.trim();
	let capNhat;
	if (b.dataset.tv === "duyet") {
		const thang = +row.querySelector(".thoiHan").value;
		let het = null;
		if (thang) {
			const goc = d.daDuyet && d.hetHan && d.hetHan.toDate() > new Date() ? d.hetHan.toDate() : new Date();
			het = new Date(goc); het.setMonth(het.getMonth() + thang);
		}
		capNhat = { daDuyet: true, hetHan: het ? Timestamp.fromDate(het) : null, ngayDuyet: serverTimestamp(), ghiChu };
	} else capNhat = { daDuyet: false, ghiChu };
	b.disabled = true;
	try { await updateDoc(doc(db, "nguoiDung", id), capNhat); hien(b.dataset.tv === "duyet" ? "Đã duyệt " + d.email : "Đã khoá " + d.email); await tai(); }
	catch (err) { hien("Không lưu được: " + err.code); b.disabled = false; }
});
$("bang").addEventListener("change", async e => {
	if (!e.target.classList.contains("ghiChu")) return;
	const id = e.target.closest("[data-id]").dataset.id;
	try { await updateDoc(doc(db, "nguoiDung", id), { ghiChu: e.target.value.trim() }); hien("Đã lưu ghi chú"); } catch (err) { hien("Không lưu được ghi chú"); }
});
$("timEmail").addEventListener("input", ve);
$("locTT").addEventListener("change", ve);
$("nutTai").addEventListener("click", tai);
</script>
</body>
</html>
